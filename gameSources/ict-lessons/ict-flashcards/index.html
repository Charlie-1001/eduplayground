<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICT Flashcards</title>
  <style>
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    *::-webkit-scrollbar {
      display: none;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      height: 100vh;
      overflow: hidden;
    }

    header {
      display: flex;
      height: 50px;
      width: 100%;
      background-color: black;
      color: white;
      align-items: center;
      padding: 0 1rem;
      position: fixed;
      top: 0;
      left: 0;
    }

    header h1 {
      flex: 1;
    }

    .select-group {
      height: 80%;
      display: flex;
      align-items: center;
      width: 25%;
    }

    .select-group select {
      font-size: 1rem;
      padding: 0.5rem;
      border: 1px solid grey;
      outline: none;
      cursor: pointer;
    }

    .select-grade {
      width: 20%;
      border-radius: 0.5rem 0 0 0.5rem;
    }

    .select-topic {
      width: 80%;
      border-radius: 0 0.5rem 0.5rem 0;
    }

    header button {
      height: 80%;
      cursor: pointer;
      padding: 0.5rem;
      margin-left: 1rem;
      border-radius: 0.5rem;
      outline: none;
      border: none;
      font-size: 1rem;
      background-color: rgb(255, 208, 0);
    }

    #container {
      height: calc(100vh - 50px);
      display: grid;
      width: 100%;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 5px;
      padding: 1rem;
      overflow-y: auto;
      margin-top: 50px;
    }

    .img-frame {
      position: relative;
      border: 1px solid grey;
      box-shadow: 3px 3px 5px rgb(123, 122, 122);
      aspect-ratio: 1 / 1;
      background-color: white;
    }

    .images {
      width: 100%;
    }

    .meaning {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      color: yellow;
      text-align: center;
      background-color: rgba(0, 0, 0, 0.664);
      padding: 0 0.5rem;
    }

    .hide-items {
      display: none;
    }

    .reading {
      display: block;
      background-color: #f0f0f0;
      color: black;
      font-size: 3rem;
      top: 50%;
      transform: translateY(-50%);
      height: fit-content;
    }

  </style>
</head>

<body>
  <header>
    <h1>ICT Notes</h1>
    <div class="select-group">
      <select class="select-grade">
        <option value="kg">KG</option>
      </select>
      <select class="select-topic">
        <option value="computer-parts">Parts of a computer</option>
      </select>
    </div>
    <button id="toggleText">Hide Text</button>
    <button id="reading">Reading</button>
  </header>

  <main id="container"></main>

  <!-- The script -->
  <script>
    const data = [ 
      
        {
          topic: "computer-parts", flashcards: [
            { name: "UPS", image: "images/ups.png" },
            { name: "System Unit", image: "images/system-unit.png" },
            { name: "Keyboard", image: "images/keyboard.png" },
            { name: "Mouse", image: "images/mouse.png" },
            { name: "Monitor", image: "images/monitor.png" },
            { name: "Microphone", image: "images/microphone.png" },
            { name: "Speaker", image: "images/speaker.png" },
            { name: "Printer", image: "images/printer.png" },
            { name: "Webcam", image: "images/webcam.png" },
            { name: "Scanner", image: "images/scanner.png" },
          ]
        },
      
    ];
    
    const container = document.getElementById("container");
    const toggleTextBtn = document.getElementById("toggleText");
    const readingBtn = document.getElementById("reading");
    const topicSelect = document.querySelector("header select");

    function loadImages(topic = "computer-parts") {
      const selectedTopic = data.find(u => u.topic === topic);
      selectedTopic.flashcards.forEach(item => {
        const imgFrame = document.createElement("div");
        const image = document.createElement("img");
        const meaning = document.createElement("h1");

        imgFrame.className = "img-frame";
        image.src = item.image;
        image.className = "images";
        meaning.className = "meaning";
        meaning.textContent = item.name;
        imgFrame.appendChild(image);
        imgFrame.appendChild(meaning);
        container.appendChild(imgFrame);
      });
    }

    loadImages();
    
    topicSelect.addEventListener("change", (e) => {
      container.innerHTML = "";
      loadImages(e.target.value);
    })

    toggleTextBtn.addEventListener("click", () => {
        toggleTextBtn.textContent = toggleTextBtn.textContent === "Hide Text" ? "Show Text" : "Hide Text";
        document.querySelectorAll(".meaning").forEach(meaning => {
          meaning.classList.toggle("hide-items");
        })
    });

    readingBtn.addEventListener("click", () => {
      readingBtn.textContent = readingBtn.textContent === "Reading" ? "Studying" : "Reading";
      document.querySelectorAll(".meaning").forEach(meaning => {
        meaning.classList.toggle("reading");
      })
      document.querySelectorAll(".images").forEach(image => {
        image.classList.toggle("hide-items");
      })
    });

  </script>
</body>
</html>
